seed: 42
data_dir: ./features  # ✅ 使用 time_data_preprocess 生成的 features 目录
emotions: [happy, sad, normal]

# ✅ 使用 NPY 数据加载器（从 time_data_preprocess）
use_npy_data: true
modalities: [filtered, powerspec, att, med]  # 使用所有模态

split:
  test_size: 0.20  # ✅ 与 time_data_preprocess 保持一致（20%）
  val_size: 0.10
  random_state: 42

preprocess:
  impute_strategy: mean
  scale: true
  augment: true
  noise_std: 0.01
  time_jitter: 0.02

model:
  type: xgboost
  cv: 5
  n_jobs: 8            # ✅ 外层并行（CPU推荐4）
  random_search: true
  n_iter: 10

  xgboost:
    device: cpu         # ✅ 先用CPU更稳更快
    tree_method: hist
    n_jobs: 1           # ✅ 内层保持1
    objective: multi:softprob
    eval_metric: mlogloss
    random_state: 42

    n_estimators: 600   # ✅ 核心提速点
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 1.0
    gamma: 0.0
    reg_lambda: 1.0
    reg_alpha: 0.0

  param_grid:
    max_depth: [3, 4, 6]                # ✅ 删8
    learning_rate: [0.03, 0.05, 0.1]
    subsample: [0.8, 0.9, 1.0]
    colsample_bytree: [0.8, 0.9, 1.0]
    reg_lambda: [0.5, 1.0, 2.0]

output:
  base_dir: outputs
  run_name: XGB

viz:
  seaborn_confusion_matrix: true
  umap_boundary: true  # 默认开启单个模型的UMAP生成 
