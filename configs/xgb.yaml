# XGBoost experiment (tabular features)
seed: 42
data_dir: ./data
emotions: [happy, sad, normal]

# optional override; default is the standard 7 csvs
# csv_files: [att.csv, med.csv, powerspec.csv, combined.csv, filtered.csv, rawwave.csv, sigqual.csv]

split:
  test_size: 0.30
  val_size: 0.10
  random_state: 42

preprocess:
  impute_strategy: mean
  scale: true
  select_k_best: null
  pca_n_components: null
  augment: true
  noise_std: 0.01
  time_jitter: 0.02

model:
  type: xgboost
  cv: 5
  n_jobs: -1

  # 这些是“基础参数”（不放进 param_grid 的固定值）
  xgboost:
    # 训练更稳定/更容易收敛的常用设置
    objective: multi:softprob
    eval_metric: mlogloss
    tree_method: auto      # cpu: auto / hist ; gpu: gpu_hist（有GPU再用）
    random_state: 42

    # base params（也可以放到 param_grid 里搜索）
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 1.0
    gamma: 0.0
    reg_lambda: 1.0
    reg_alpha: 0.0

  # 网格搜索的参数（别放太大，先跑通再加）
  param_grid:
    n_estimators: [300, 500]
    max_depth: [4, 6, 8]
    learning_rate: [0.03, 0.05, 0.1]
    subsample: [0.8, 0.9, 1.0]
    colsample_bytree: [0.8, 0.9, 1.0]
    reg_lambda: [0.5, 1.0, 2.0]

output:
  base_dir: outputs
  run_name: xgb_baseline

viz:
  seaborn_confusion_matrix: false  # 使用matplotlib风格的混淆矩阵
  umap_boundary: false  # 默认关闭单个模型的UMAP生成
