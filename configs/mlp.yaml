# MLP experiment
seed: 42
data_dir: ./features  # ✅ 使用 time_data_preprocess 生成的 features 目录
emotions: [happy, sad, normal]

# ✅ 使用 NPY 数据加载器（从 time_data_preprocess）
use_npy_data: true
modalities: [filtered, powerspec, att, med]  # 使用所有模态

split:
  test_size: 0.20  # ✅ 与 time_data_preprocess 保持一致（20%）
  val_size: 0.10
  random_state: 42

preprocess:
  impute_strategy: mean
  scale: true
  select_k_best: null
  pca_n_components: null
  augment: true
  noise_std: 0.01
  time_jitter: 0.02

model:
  type: mlp
  cv: 5
  n_jobs: -1
  max_iter: 800
  random_state: 42
  param_grid:
    hidden_layer_sizes: [[64], [128], [128, 64]]
    activation: [relu, tanh]
    alpha: [0.0001, 0.001, 0.01]
    learning_rate_init: [0.001, 0.0005]
    solver: [adam]

output:
  base_dir: outputs
  run_name: MLP

viz:
  seaborn_confusion_matrix: true  # 使用seaborn风格的混淆矩阵
  umap_boundary: true  # 默认开启单个模型的UMAP生成 
